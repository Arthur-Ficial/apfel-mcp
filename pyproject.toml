[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apfel-mcp"
version = "0.2.0"
description = "Token-budget-optimized MCP servers for apfel (url-fetch + ddg-search + search-and-fetch + fs)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Arthur Ficial", email = "arti.ficial@fullstackoptimization.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "readability-lxml>=0.8.4",
    # lxml 5.2+ moved html.clean into its own package; readability-lxml still
    # imports it. Pin explicitly so Homebrew's virtualenv install pulls it.
    "lxml_html_clean>=0.4",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "respx>=0.20",
    "ruff>=0.5",
]

[project.scripts]
apfel-mcp-url-fetch = "apfel_mcp.url_fetch_server:main"
apfel-mcp-ddg-search = "apfel_mcp.ddg_search_server:main"
apfel-mcp-search-and-fetch = "apfel_mcp.search_and_fetch_server:main"
apfel-mcp-fs = "apfel_mcp.fs_server:main"

[project.urls]
Homepage = "https://github.com/Arthur-Ficial/apfel-mcp"
Issues = "https://github.com/Arthur-Ficial/apfel-mcp/issues"
Repository = "https://github.com/Arthur-Ficial/apfel-mcp.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]
